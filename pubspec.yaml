name: clipcut
description: Auto-cut long videos into short-form clips. Offline video editing app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  # Video Processing
  ffmpeg_kit_flutter_new: ^4.1.0
  video_player: ^2.8.2

  # File Handling
  file_picker: ^10.3.8
  path_provider: ^2.1.2
  permission_handler: ^11.3.0

  # State Management
  flutter_riverpod: ^2.4.9

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Utilities
  uuid: ^4.3.3
  intl: ^0.19.0

  # UI Components
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  flutter_colorpicker: ^1.0.3
  open_filex: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true